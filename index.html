<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9fb5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>간호영어 단어장</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4f1;--card:#ffffff;--ink:#4a3b47;--sub:#8c7a88;--mint:#8fd9c4;--mint-d:#3fae92;--pink:#ff9fb5;--pink-d:#e56a8c;--yellow:#ffe29a;--line:#f6d9d9;--wrong:#ffb4a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2230;--card:#3a3042;--ink:#fbeff3;--sub:#c3aebd;--line:#52445c;--yellow:#7a6a3a}}
:root[data-theme="dark"]{--bg:#2a2230;--card:#3a3042;--ink:#fbeff3;--sub:#c3aebd;--line:#52445c;--yellow:#7a6a3a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,.en{font-family:'Jua','Apple SD Gothic Neo',sans-serif;font-weight:400}
header{text-align:center;padding:6px 0 14px}
h1{font-size:26px;margin:0;color:var(--pink-d)}
header p{margin:2px 0 0;color:var(--sub)}
.badge{display:inline-block;background:var(--yellow);border-radius:999px;padding:2px 12px;font-size:14px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--card);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(229,106,140,.12)}
nav .in{display:flex;gap:6px;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--sub);font-family:'Jua',sans-serif;font-size:13px;line-height:1.2;padding:6px 4px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
nav button span{font-size:22px;line-height:1}
nav button.on{background:var(--pink);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint-d);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.tools{display:flex;gap:8px;margin-bottom:12px}
input,select{font-size:16px;min-height:46px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.item{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.item .t{flex:1;min-width:0}
.en{font-size:20px;color:var(--ink)}
.ko{color:var(--sub);font-size:15px}
.ex{font-size:13px;color:var(--sub);margin-top:2px;font-style:italic}
.tag{font-size:12px;background:var(--mint);color:#17503f;border-radius:999px;padding:1px 9px;margin-left:6px;font-family:'Gowun Dodum',sans-serif;vertical-align:middle}
.ib{border:0;background:var(--bg);border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:16px;flex:none}
.star.on{background:var(--yellow)}
.btn{min-height:50px;border:0;background:var(--mint);color:#17503f;font-family:'Jua',sans-serif;font-size:17px;border-radius:16px;padding:12px 18px;cursor:pointer;width:100%}
.btn.pink{background:var(--pink);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
label{display:block;margin:10px 0 4px;color:var(--sub);font-size:14px}
.row{display:flex;gap:8px}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.q{text-align:center;padding:26px 14px}
.q .en{font-size:34px;color:var(--pink-d)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{min-height:52px;font-size:17px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:16px;padding:12px;cursor:pointer;text-align:left}
.opt.ok{background:var(--mint);border-color:var(--mint-d);color:#17503f}
.opt.no{background:var(--wrong);border-color:var(--pink-d);color:#6b2a20}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pink);width:0;transition:width .3s}
.score{font-family:'Jua',sans-serif;font-size:48px;color:var(--pink-d);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.hide{display:none}
@media (max-width:380px){.item{flex-wrap:wrap}.item .t{flex-basis:100%}.q .en{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🩺 간호영어 단어장</h1>
    <p>눈에 쏙쏙, 임상영어 같이 외워요</p>
    <span class="badge" id="stat"></span>
  </header>
  

  <section id="list">
    <div class="tools">
      <input id="search" placeholder="영어 또는 한글로 검색" aria-label="검색">
      <select id="filter" aria-label="분류" style="max-width:130px"></select>
    </div>
    <div id="items"></div>
  </section>

  <section id="add" class="hide">
    <div class="card">
      <label for="fEn">영어 단어</label><input id="fEn" placeholder="예: dyspnea" autocomplete="off">
      <label for="fKo">한글 뜻</label><input id="fKo" placeholder="예: 호흡곤란" autocomplete="off">
      <label for="fCat">분류</label><select id="fCat"></select>
      <label for="fEx">예문 (선택)</label><input id="fEx" placeholder="예: The patient complains of dyspnea." autocomplete="off">
      <div style="height:14px"></div>
      <button class="btn pink" id="addBtn">단어 저장하기</button>
    </div>
  </section>

  <section id="quiz" class="hide"></section>
</div>
<nav role="tablist" aria-label="메뉴"><div class="in">
    <button class="on" data-tab="list"><span>📖</span>단어장</button>
    <button data-tab="add"><span>➕</span>추가</button>
    <button data-tab="quiz"><span>🎯</span>퀴즈</button>
  </div></nav>
<div class="toast" id="toast"></div>

<script>
const CATS=['증상','신체부위','처치·간호','약물','검사','기본'];
const SEED=[
['dyspnea','호흡곤란','증상','The patient complains of dyspnea.'],
['nausea','메스꺼움','증상','She reported nausea after the meal.'],
['edema','부종','증상','Check for pitting edema in the legs.'],
['fever','발열','증상','He has had a fever for two days.'],
['vital signs','활력징후','검사','Take the patient\'s vital signs every 4 hours.'],
['blood pressure','혈압','검사','Blood pressure is 120/80 mmHg.'],
['pulse','맥박','검사','The pulse is regular and strong.'],
['respiration','호흡','검사','Respiration rate is 18 per minute.'],
['abdomen','복부','신체부위','The abdomen is soft and non-tender.'],
['kidney','신장','신체부위','Monitor kidney function closely.'],
['wound dressing','상처 드레싱','처치·간호','Change the wound dressing daily.'],
['catheter','도관(카테터)','처치·간호','Insert a urinary catheter aseptically.'],
['injection','주사','처치·간호','Give the injection intramuscularly.'],
['intravenous (IV)','정맥내','처치·간호','Start an IV line on the left arm.'],
['discharge','퇴원','처치·간호','Provide discharge teaching to the family.'],
['analgesic','진통제','약물','An analgesic was given for the pain.'],
['antibiotic','항생제','약물','Take the antibiotic as prescribed.'],
['dosage','용량','약물','Verify the dosage before administering.'],
['allergy','알레르기','기본','Ask the patient about drug allergies.'],
['assessment','사정(평가)','기본','Perform a head-to-toe assessment.']
];
const KEY='nursingVocab_v1';
let words=[],tab='list',quizState=null;
function load(){try{const r=localStorage.getItem(KEY);if(r){words=JSON.parse(r);return}}catch(e){}
  words=SEED.map((w,i)=>({id:i+1,en:w[0],ko:w[1],cat:w[2],ex:w[3],fav:false}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}}
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function fillCats(){
  $('#fCat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
  $('#filter').innerHTML=['전체','⭐ 즐겨찾기',...CATS].map(c=>`<option>${c}</option>`).join('');
}
function renderList(){
  const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;
  const r=words.filter(w=>(f==='전체'||(f==='⭐ 즐겨찾기'?w.fav:w.cat===f))&&(!q||w.en.toLowerCase().includes(q)||w.ko.includes(q)));
  $('#items').innerHTML=r.length?r.map(w=>`<div class="item"><div class="t"><div class="en">${esc(w.en)}<span class="tag">${esc(w.cat)}</span></div><div class="ko">${esc(w.ko)}</div>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:''}</div>
  <button class="ib" data-say="${w.id}" aria-label="발음 듣기">🔊</button>
  <button class="ib star ${w.fav?'on':''}" data-fav="${w.id}" aria-label="즐겨찾기">${w.fav?'⭐':'☆'}</button>
  <button class="ib" data-del="${w.id}" aria-label="삭제">🗑️</button></div>`).join(''):'<div class="empty">🫧 찾는 단어가 없어요.<br>‘추가’ 탭에서 새 단어를 넣어보세요!</div>';
  $('#stat').textContent=`총 ${words.length}개 · 즐겨찾기 ${words.filter(w=>w.fav).length}개`;
}
$('#items').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.say){const w=words.find(x=>x.id==b.dataset.say);if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}}
  if(b.dataset.fav){const w=words.find(x=>x.id==b.dataset.fav);w.fav=!w.fav;save();renderList()}
  if(b.dataset.del&&confirm('이 단어를 삭제할까요?')){words=words.filter(x=>x.id!=b.dataset.del);save();renderList();toast('삭제했어요')}
});
$('#search').oninput=renderList;$('#filter').onchange=renderList;

$('#addBtn').onclick=()=>{
  const en=$('#fEn').value.trim(),ko=$('#fKo').value.trim();
  if(!en||!ko){toast('영어 단어와 한글 뜻을 모두 입력해 주세요');return}
  if(words.some(w=>w.en.toLowerCase()===en.toLowerCase())){toast('이미 있는 단어예요');return}
  words.unshift({id:Date.now(),en,ko,cat:$('#fCat').value,ex:$('#fEx').value.trim(),fav:false});
  save();['#fEn','#fKo','#fEx'].forEach(s=>$(s).value='');
  toast('저장했어요! 🎉');renderList();$('#fEn').focus();
};

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function quizHome(){
  quizState=null;
  $('#quiz').innerHTML=`<div class="card"><h2 style="margin:0 0 6px">🎯 퀴즈 설정</h2><p class="ko" style="margin:0 0 8px">단어를 보고 알맞은 뜻을 골라요.</p>
  <label for="qMode">유형</label><select id="qMode"><option value="en">영어 → 한글 뜻 고르기</option><option value="ko">한글 → 영어 단어 고르기</option></select>
  <label for="qScope">범위</label><select id="qScope"><option>전체</option><option>⭐ 즐겨찾기</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
  <label for="qNum">문제 수</label><select id="qNum"><option>5</option><option selected>10</option><option>20</option></select>
  <div style="height:14px"></div><button class="btn pink" id="qStart">시작하기</button></div>`;
  $('#qStart').onclick=startQuiz;
}
function startQuiz(){
  const mode=$('#qMode').value,sc=$('#qScope').value,n=+$('#qNum').value;
  const pool=words.filter(w=>sc==='전체'||(sc==='⭐ 즐겨찾기'?w.fav:w.cat===sc));
  if(pool.length<1){toast('이 범위에 단어가 없어요');return}
  if(words.length<4){toast('퀴즈는 단어가 4개 이상 필요해요');return}
  quizState={mode,qs:shuffle(pool).slice(0,n),i:0,score:0,wrong:[],done:false};
  renderQ();
}
function renderQ(){
  const s=quizState;
  if(s.i>=s.qs.length){
    const pct=Math.round(s.score/s.qs.length*100);
    $('#quiz').innerHTML=`<div class="card"><div class="score">${s.score} / ${s.qs.length}</div><p style="text-align:center;margin:0 0 14px">${pct>=80?'대단해요! 국시 준비 완벽 🥳':pct>=50?'좋아요, 조금만 더! 💪':'괜찮아요, 다시 도전해요 🌱'}</p>
    ${s.wrong.length?`<h2 style="margin:0 0 8px;font-size:18px">다시 볼 단어</h2>`+s.wrong.map(w=>`<div class="item"><div class="t"><div class="en">${esc(w.en)}</div><div class="ko">${esc(w.ko)}</div></div></div>`).join(''):''}
    <div class="row"><button class="btn ghost" id="qHome">설정으로</button><button class="btn pink" id="qAgain">다시 풀기</button></div></div>`;
    $('#qHome').onclick=quizHome;$('#qAgain').onclick=startQuiz;return;
  }
  const w=s.qs[s.i],en=s.mode==='en';
  const others=shuffle(words.filter(x=>x.id!==w.id)).slice(0,3);
  const opts=shuffle([w,...others]);
  $('#quiz').innerHTML=`<div class="bar"><i style="width:${s.i/s.qs.length*100}%"></i></div>
  <div class="card q"><div class="ko">${s.i+1} / ${s.qs.length}</div><div class="en">${esc(en?w.en:w.ko)}</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(en?o.ko:o.en)}</button>`).join('')}</div>
  <div id="fb" class="ko" style="margin-top:12px;min-height:24px"></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(s.done)return;s.done=true;
    const ok=b.dataset.id==w.id;
    if(ok)s.score++;else s.wrong.push(w);
    b.classList.add(ok?'ok':'no');
    document.querySelector(`.opt[data-id="${w.id}"]`).classList.add('ok');
    $('#fb').innerHTML=(ok?'정답이에요! 🎉':'아쉬워요 😢')+(w.ex?`<div class="ex">${esc(w.ex)}</div>`:'')+`<div style="margin-top:10px"><button class="btn" id="next">${s.i+1<s.qs.length?'다음 문제':'결과 보기'}</button></div>`;
    $('#next').onclick=()=>{s.i++;s.done=false;renderQ()};$('#next').focus();
  });
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['list','add','quiz'].forEach(id=>$('#'+id).classList.toggle('hide',id!==b.dataset.tab));
  window.scrollTo(0,0);
  if(b.dataset.tab==='quiz'&&!quizState)quizHome();
  if(b.dataset.tab==='list')renderList();
});
load();fillCats();renderList();
</script>
</body>
</html>
